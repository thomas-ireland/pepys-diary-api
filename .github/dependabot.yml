version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      # Pinned deliberately: the native TypeScript 7 compiler and Node 26 types
      # are ahead of what this template targets. Patch and minor updates still
      # apply automatically; only major bumps are held back.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
