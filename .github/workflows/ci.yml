name: ci

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC — surfaces newly disclosed advisories on an idle repo.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: pepys
          POSTGRES_PASSWORD: pepys
          POSTGRES_DB: pepys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pepys -d pepys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pepys:pepys@localhost:5432/pepys?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify dependency signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Validate database schema
        run: npm run db:validate
      - name: Apply migrations
        run: npm run db:deploy
      - name: Seed the database
        run: npm run db:seed
      - name: Test
        run: npm run test
      # Seeds again on top of the row above, so this also proves a reseed over
      # existing data lands identically.
      - name: Test against the database
        run: npm run test:db
      - name: Build
        run: npm run build
      # The runtime image strips packages Prisma declares as runtime
      # dependencies but doesn't use to serve requests. This proves the
      # stripped image still starts and queries, so a future Prisma release
      # that genuinely needs one of them fails here rather than in production.
      - name: Build the container image
        run: docker build -t pepys-api:ci .
      - name: Smoke test the container image
        run: |
          docker run -d --name pepys-api-ci --network host \
            -e DATABASE_URL="$DATABASE_URL" pepys-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health | grep -q '"status":"ok"'; then
              echo "container healthy and reaching Postgres"
              docker rm -f pepys-api-ci >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy" >&2
          docker logs pepys-api-ci >&2
          exit 1
      # Production runs this image with TLS_CERT_PATH/TLS_KEY_PATH set (see
      # CLAUDE.md's Deployment section); this is the only place that path,
      # including the healthcheck script's cert-trust bypass, gets exercised
      # for real rather than just at the unit-test level.
      - name: Generate a throwaway TLS cert for the HTTPS smoke test
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/certs/key.pem -out /tmp/certs/cert.pem \
            -days 1 -subj "/CN=localhost"
      - name: Smoke test the container image over HTTPS
        run: |
          docker run -d --name pepys-api-ci-https --network host \
            -v /tmp/certs:/app/certs:ro \
            -e DATABASE_URL="$DATABASE_URL" \
            -e TLS_CERT_PATH=/app/certs/cert.pem \
            -e TLS_KEY_PATH=/app/certs/key.pem \
            pepys-api:ci
          for i in $(seq 1 30); do
            if curl -fsSk https://localhost:3000/health | grep -q '"status":"ok"'; then
              echo "container healthy over HTTPS and reaching Postgres"
              docker rm -f pepys-api-ci-https >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy over HTTPS" >&2
          docker logs pepys-api-ci-https >&2
          exit 1
      - name: Audit for known vulnerabilities
        run: npm audit --audit-level=high
