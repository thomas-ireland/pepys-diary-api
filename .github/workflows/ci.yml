name: ci

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC — surfaces newly disclosed advisories on an idle repo.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: pepys
          POSTGRES_PASSWORD: pepys
          POSTGRES_DB: pepys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pepys -d pepys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pepys:pepys@localhost:5432/pepys?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify dependency signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Validate database schema
        run: npm run db:validate
      - name: Apply migrations
        run: npm run db:deploy
      - name: Seed the database
        run: npm run db:seed
      - name: Test
        run: npm run test
      # Seeds again on top of the row above, so this also proves a reseed over
      # existing data lands identically.
      - name: Test against the database
        run: npm run test:db
      - name: Build
        run: npm run build
      # The runtime image strips packages Prisma declares as runtime
      # dependencies but doesn't use to serve requests. This proves the
      # stripped image still starts and queries, so a future Prisma release
      # that genuinely needs one of them fails here rather than in production.
      - name: Build the container image
        run: docker build -t pepys-api:ci .
      - name: Smoke test the container image
        run: |
          docker run -d --name pepys-api-ci --network host \
            -e DATABASE_URL="$DATABASE_URL" pepys-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health | grep -q '"status":"ok"'; then
              echo "container healthy and reaching Postgres"
              docker rm -f pepys-api-ci >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy" >&2
          docker logs pepys-api-ci >&2
          exit 1
      # Production runs this in front of the app as a reverse proxy (see
      # CLAUDE.md's Deployment section). `caddy validate` also loads
      # whatever cert the Caddyfile references, so this needs a real (if
      # throwaway) cert present to validate cleanly -- not just a syntax
      # check.
      - name: Validate the Caddyfile
        run: |
          mkdir -p /tmp/caddy-validate-certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/caddy-validate-certs/origin-key.pem \
            -out /tmp/caddy-validate-certs/origin-cert.pem \
            -days 1 -subj "/CN=api.pepys.dev"
          docker run --rm \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v /tmp/caddy-validate-certs:/etc/caddy/certs:ro \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Audit for known vulnerabilities
        run: npm audit --audit-level=high
