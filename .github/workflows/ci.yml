name: ci

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC — surfaces newly disclosed advisories on an idle repo.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: pepys
          POSTGRES_PASSWORD: pepys
          POSTGRES_DB: pepys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pepys -d pepys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pepys:pepys@localhost:5432/pepys?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify dependency signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Validate database schema
        run: npm run db:validate
      - name: Apply migrations
        run: npm run db:deploy
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Audit for known vulnerabilities
        run: npm audit --audit-level=high
