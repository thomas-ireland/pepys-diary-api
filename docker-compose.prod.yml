services:
  postgres:
    # Digest pins the exact image content -- see Dockerfile.
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: pepys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pepys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pepys
    ports:
      # Loopback only -- never the public interface. Reachable for admin
      # work (migrations, seeding) via an SSH tunnel, nothing else.
      - "127.0.0.1:5432:5432"
    volumes:
      # Distinct name from docker-compose.yml's pepys-pgdata -- both resolve
      # under the same default (directory-name) project, so a shared name
      # would silently attach this to dev's data volume instead of a fresh
      # one.
      - pepys-pgdata-prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pepys -d pepys"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: pepys-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pepys:${POSTGRES_PASSWORD}@postgres:5432/pepys?schema=public
    # No `ports:` -- not reachable except via Caddy, over the internal
    # compose network as `app:3000`. Runs as the image's default USER node;
    # it never touches the TLS certificate, so it needs no elevated access
    # to anything on the host.

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: pepys-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # Runs as a dedicated, unprivileged system account (never your own admin
    # user) -- see CLAUDE.md's Deployment section for why and how to create
    # it. Caddy is the one thing here directly exposed to the internet, so
    # it's the last place to run as anything with real privileges on the
    # host.
    user: "${CADDY_UID}:${CADDY_GID}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      # Public (Cloudflare publishes this for anyone to use), so committed
      # to the repo directly rather than placed on the server like certs/.
      - ./cloudflare-origin-pull-ca.pem:/etc/caddy/cloudflare-origin-pull-ca.pem:ro
    ports:
      # 443 only -- Cloudflare's Full (strict) mode always speaks HTTPS to
      # the origin, so there's nothing for port 80 to do here.
      - "443:443"

volumes:
  pepys-pgdata-prod:
