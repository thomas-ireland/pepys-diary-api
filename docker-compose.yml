services:
  postgres:
    # Digest pins the exact image content -- see Dockerfile.
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: pepys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pepys
      POSTGRES_PASSWORD: pepys
      POSTGRES_DB: pepys
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ wants a single mount here, not at .../data -- it places
      # the cluster in a version-specific subdirectory of its own.
      - pepys-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pepys -d pepys"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pepys-pgdata:
